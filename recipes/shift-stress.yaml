seed: 51

dataset:
  task: classification
  n_train: 512
  n_test: 256
  n_features_min: 12
  n_features_max: 48
  n_classes_min: 2
  n_classes_max: 10
  categorical_ratio_min: 0.1
  categorical_ratio_max: 0.8
  max_categorical_cardinality: 16
  missing_rate: 0.0
  missing_mechanism: none

graph:
  n_nodes_min: 4
  n_nodes_max: 24

shift:
  enabled: true
  mode: mixed
  graph_scale: 0.4
  variance_scale: 0.4

runtime:
  device: cpu

output:
  out_dir: data/recipes/shift_stress

diagnostics:
  enabled: false

filter:
  enabled: false
