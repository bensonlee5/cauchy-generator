  - {artifact: emitted_metadata_common, path: "teacher_conditionals.schema_version", type: "int", presence: when teacher_conditionals present, stability_tier: stable, producer: dagzoo.core.generation_runtime._teacher_conditionals_metadata, rationale: teacher-conditionals schema version, audit_status: keep}
