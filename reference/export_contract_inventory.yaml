schema: dagzoo-export-contract-inventory-v1
artifacts:
  dataset_bundle:
    label: DatasetBundle
    description: Public in-memory wrapper returned by generate APIs.
  metadata_ndjson_record:
    label: metadata.ndjson record
    description: One per-dataset NDJSON record persisted under shard metadata.
  emitted_metadata_common:
    label: Common emitted metadata payload
    description: Shared metadata payload used by DatasetBundle.metadata and metadata.ndjson metadata.
  emitted_metadata_dense_lineage:
    label: In-memory dense lineage payload
    description: Dense lineage shape used inside DatasetBundle.metadata.
  emitted_metadata_compact_lineage:
    label: On-disk compact lineage payload
    description: Compact lineage shape used inside metadata.ndjson records after shard persistence.
  parquet_split_row:
    label: Packed parquet split row
    description: Row schema shared by shard train.parquet and test.parquet.
  lineage_index_json:
    label: Lineage adjacency index JSON
    description: Shard-level compact-lineage index written under lineage/adjacency.index.json.
  generate_handoff_manifest:
    label: Generate handoff manifest
    description: Stable downstream manifest written by dagzoo generate --handoff-root.
  coverage_summary_json:
    label: Coverage summary JSON
    description: Diagnostics coverage summary artifact written when generation diagnostics are enabled.
entries:
  - {artifact: dataset_bundle, path: "X_train", type: "torch.Tensor[float32|float64]", presence: always, stability_tier: stable, producer: dagzoo.core.dataset.generate_one, rationale: training feature matrix, audit_status: keep}
  - {artifact: dataset_bundle, path: "y_train", type: "torch.Tensor[int64|float]", presence: always, stability_tier: stable, producer: dagzoo.core.dataset.generate_one, rationale: training targets, audit_status: keep}
  - {artifact: dataset_bundle, path: "X_test", type: "torch.Tensor[float32|float64]", presence: always, stability_tier: stable, producer: dagzoo.core.dataset.generate_one, rationale: test feature matrix, audit_status: keep}
  - {artifact: dataset_bundle, path: "y_test", type: "torch.Tensor[int64|float]", presence: always, stability_tier: stable, producer: dagzoo.core.dataset.generate_one, rationale: test targets, audit_status: keep}
  - {artifact: dataset_bundle, path: "feature_types", type: "list[string]", presence: always, stability_tier: stable, producer: dagzoo.core.dataset.generate_one, rationale: emitted feature typing, audit_status: keep}
  - {artifact: dataset_bundle, path: "feature_types[]", type: "string", presence: when feature count > 0, stability_tier: stable, producer: dagzoo.core.dataset.generate_one, rationale: per-column emitted feature type, audit_status: keep}
  - {artifact: dataset_bundle, path: "metadata", type: "object", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._build_bundle_metadata, rationale: emitted dataset metadata payload, audit_status: keep}

  - {artifact: metadata_ndjson_record, path: "dataset_index", type: "int", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer.write_packed_parquet_shards_stream, rationale: record index within the generated run, audit_status: keep}
  - {artifact: metadata_ndjson_record, path: "n_train", type: "int", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer.write_packed_parquet_shards_stream, rationale: persisted train row count, audit_status: keep}
  - {artifact: metadata_ndjson_record, path: "n_test", type: "int", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer.write_packed_parquet_shards_stream, rationale: persisted test row count, audit_status: keep}
  - {artifact: metadata_ndjson_record, path: "n_features", type: "int", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer.write_packed_parquet_shards_stream, rationale: persisted feature count, audit_status: keep}
  - {artifact: metadata_ndjson_record, path: "feature_types", type: "list[string]", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer.write_packed_parquet_shards_stream, rationale: persisted feature typing, audit_status: keep}
  - {artifact: metadata_ndjson_record, path: "feature_types[]", type: "string", presence: when feature count > 0, stability_tier: stable, producer: dagzoo.io.parquet_writer.write_packed_parquet_shards_stream, rationale: persisted per-column emitted feature type, audit_status: keep}
  - {artifact: metadata_ndjson_record, path: "metadata", type: "object", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer.write_packed_parquet_shards_stream, rationale: persisted emitted metadata payload, audit_status: keep}

  - {artifact: parquet_split_row, path: "dataset_index", type: "int64", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: row-to-dataset join key, audit_status: keep}
  - {artifact: parquet_split_row, path: "row_index", type: "int64", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: row position within one split, audit_status: keep}
  - {artifact: parquet_split_row, path: "x", type: "list[float32|float64]", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: packed feature vector, audit_status: keep}
  - {artifact: parquet_split_row, path: "'x[]'", type: "float32|float64", presence: when feature count > 0, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: emitted feature cell value, audit_status: keep}
  - {artifact: parquet_split_row, path: "y", type: "int64|float", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: emitted target value, audit_status: keep}

  - {artifact: emitted_metadata_common, path: "attempt_used", type: "int", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._build_bundle_metadata, rationale: generation attempt index, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "backend", type: "string", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._build_bundle_metadata, rationale: tensor backend identifier, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "compute_backend", type: "string", presence: always, stability_tier: internal, producer: dagzoo.core.generation_runtime._base_bundle_metadata_for_layout, rationale: implementation variant identifier, audit_status: internal-only}
