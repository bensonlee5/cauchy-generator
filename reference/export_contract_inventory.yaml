  - {artifact: emitted_metadata_common, path: "dataset_seed", type: "int", presence: canonical generation only, stability_tier: stable, producer: dagzoo.core.dataset._annotate_canonical_batch_metadata, rationale: per-dataset canonical replay seed, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "dataset_index", type: "int", presence: canonical generation only, stability_tier: stable, producer: dagzoo.core.dataset._annotate_canonical_batch_metadata, rationale: canonical dataset index, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "dataset_id", type: "string", presence: canonical generation only, stability_tier: stable, producer: dagzoo.core.dataset._annotate_canonical_batch_metadata, rationale: stable canonical dataset id, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "run_num_datasets", type: "int", presence: canonical generation only, stability_tier: stable, producer: dagzoo.core.dataset._annotate_canonical_batch_metadata, rationale: canonical run dataset count, audit_status: keep}
