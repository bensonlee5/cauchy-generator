schema: dagzoo-export-contract-inventory-v1
artifacts:
  dataset_catalog_record:
    label: dataset_catalog.ndjson record
    description: One minimal per-dataset record written under each generated shard.
  parquet_split_row:
    label: Packed parquet split row
    description: Row schema shared by shard train.parquet and test.parquet.
  generate_handoff_manifest:
    label: Generate handoff manifest
    description: Minimal downstream handoff manifest written by dagzoo generate --handoff-root.
  coverage_summary_json:
    label: Coverage summary JSON
    description: Stable top-level diagnostics coverage summary fields.
entries:
  - {artifact: dataset_catalog_record, path: "dataset_index", type: "int", presence: always, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: record index within the generated run, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "dataset_id", type: "string", presence: always, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: stable canonical dataset id, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "task", type: "string", presence: always, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: dataset task label, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "n_train", type: "int", presence: always, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: persisted train row count, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "n_test", type: "int", presence: always, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: persisted test row count, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "n_features", type: "int", presence: always, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: persisted feature count, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "feature_types", type: "list[string]", presence: always, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: emitted feature typing, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "feature_types[]", type: "string", presence: when feature count > 0, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: per-column emitted feature type, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "n_classes", type: "int|null", presence: always, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: emitted class count for classification tasks, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "group_ids", type: "object", presence: when canonical grouping ids are available, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: stable downstream grouping keys, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "group_ids.request_run", type: "string", presence: when group_ids present, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: request-run grouping key, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "group_ids.layout_plan", type: "string", presence: when group_ids present, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: shared layout-plan grouping key, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "target_derivation", type: "string", presence: when target derivation metadata is available, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: current target-derivation contract marker, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "target_relevance", type: "object", presence: when target relevance audit metadata is available, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: observed feature relevance summary for the latent target, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "target_relevance.feature_count", type: "int", presence: when target_relevance present, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: count of emitted features with a path into the target node, audit_status: keep}
  - {artifact: dataset_catalog_record, path: "target_relevance.feature_fraction", type: "float", presence: when target_relevance present, stability_tier: stable, producer: dagzoo.io.shard_contract.build_dataset_catalog_record, rationale: feature_count normalized by emitted feature count, audit_status: keep}

  - {artifact: parquet_split_row, path: "dataset_index", type: "int64", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: row-to-dataset join key, audit_status: keep}
  - {artifact: parquet_split_row, path: "row_index", type: "int64", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: row position within one split, audit_status: keep}
  - {artifact: parquet_split_row, path: "x", type: "list[float32|float64]", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: packed feature vector, audit_status: keep}
  - {artifact: parquet_split_row, path: "x[]", type: "float32|float64", presence: when feature count > 0, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: emitted feature cell value, audit_status: keep}
  - {artifact: parquet_split_row, path: "y", type: "int64|float", presence: always, stability_tier: stable, producer: dagzoo.io.parquet_writer._build_split_table, rationale: emitted target value, audit_status: keep}

  - {artifact: generate_handoff_manifest, path: "schema_name", type: "string", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: handoff manifest schema identifier, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "schema_version", type: "int", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: handoff manifest schema version, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "identity", type: "object", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: stable generated corpus identity payload, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "identity.source_family", type: "string", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: handoff source family tag, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "identity.generate_run_id", type: "string", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: stable generate-run id, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "identity.generated_corpus_id", type: "string", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: stable generated corpus id, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "artifacts_relative", type: "object", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: manifest-relative artifact paths, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "artifacts_relative.generated_dir", type: "string", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: relative generated-dir path, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "artifacts_relative.curated_dir", type: "string", presence: when curated accepted-only shards exist, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: relative curated-dir path, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "summary", type: "object", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: generated dataset count summary, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "summary.generated_datasets", type: "int", presence: always, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: number of generated datasets, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "provenance", type: "object", presence: when generated catalogs expose corpus-level provenance, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: summarized latent-target provenance for downstream corpus consumers, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "provenance.target_derivation", type: "string", presence: when provenance present, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: current target-derivation contract marker, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "provenance.target_relevant_feature_count_range", type: "object", presence: when provenance present, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: min/max relevant feature counts across the generated corpus, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "provenance.target_relevant_feature_count_range.min", type: "int", presence: when provenance.target_relevant_feature_count_range present, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: lower bound of observed relevant feature counts, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "provenance.target_relevant_feature_count_range.max", type: "int", presence: when provenance.target_relevant_feature_count_range present, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: upper bound of observed relevant feature counts, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "provenance.target_relevant_feature_fraction_range", type: "object", presence: when provenance present, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: min/max relevant feature fractions across the generated corpus, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "provenance.target_relevant_feature_fraction_range.min", type: "float", presence: when provenance.target_relevant_feature_fraction_range present, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: lower bound of observed relevant feature fractions, audit_status: keep}
  - {artifact: generate_handoff_manifest, path: "provenance.target_relevant_feature_fraction_range.max", type: "float", presence: when provenance.target_relevant_feature_fraction_range present, stability_tier: stable, producer: dagzoo.core.generate_handoff.write_generate_handoff_manifest, rationale: upper bound of observed relevant feature fractions, audit_status: keep}

  - {artifact: coverage_summary_json, path: "generated_at", type: "string", presence: always, stability_tier: stable, producer: dagzoo.diagnostics.coverage.write_coverage_summary_json, rationale: diagnostics summary timestamp, audit_status: keep}
  - {artifact: coverage_summary_json, path: "num_datasets", type: "int", presence: always, stability_tier: stable, producer: dagzoo.diagnostics.coverage.write_coverage_summary_json, rationale: number of aggregated datasets, audit_status: keep}
  - {artifact: coverage_summary_json, path: "task_counts", type: "object", presence: always, stability_tier: stable, producer: dagzoo.diagnostics.coverage.write_coverage_summary_json, rationale: aggregated task counts, audit_status: keep}
  - {artifact: coverage_summary_json, path: "'task_counts.*'", type: "int", presence: when task_counts present, stability_tier: stable, producer: dagzoo.diagnostics.coverage.write_coverage_summary_json, rationale: one aggregated task count, audit_status: keep}
  - {artifact: coverage_summary_json, path: "histogram_bins", type: "int", presence: always, stability_tier: stable, producer: dagzoo.diagnostics.coverage.write_coverage_summary_json, rationale: histogram bin count used for diagnostics, audit_status: keep}
  - {artifact: coverage_summary_json, path: "quantiles", type: "list[float]", presence: always, stability_tier: stable, producer: dagzoo.diagnostics.coverage.write_coverage_summary_json, rationale: requested quantile levels, audit_status: keep}
  - {artifact: coverage_summary_json, path: "quantiles[]", type: "float", presence: when quantiles present, stability_tier: stable, producer: dagzoo.diagnostics.coverage.write_coverage_summary_json, rationale: one requested quantile level, audit_status: keep}
