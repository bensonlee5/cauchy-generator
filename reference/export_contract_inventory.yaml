  - {artifact: emitted_metadata_common, path: "requested_device", type: "string", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._build_bundle_metadata, rationale: normalized requested runtime device, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "resolved_device", type: "string", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._build_bundle_metadata, rationale: resolved runtime device, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "device_fallback_reason", type: "string|null", presence: always, stability_tier: reserved, producer: dagzoo.core.generation_runtime._build_bundle_metadata, rationale: reserved fallback context slot, audit_status: reserved}
  - {artifact: emitted_metadata_common, path: "n_features", type: "int", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._base_bundle_metadata_for_layout, rationale: emitted feature count, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "n_categorical_features", type: "int", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._base_bundle_metadata_for_layout, rationale: emitted categorical feature count, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "n_classes", type: "int|null", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._build_bundle_metadata, rationale: realized emitted class count for classification tasks, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "graph_nodes", type: "int", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._base_bundle_metadata_for_layout, rationale: sampled DAG node count, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "graph_edges", type: "int", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._base_bundle_metadata_for_layout, rationale: sampled DAG edge count, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "graph_depth_nodes", type: "int", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._base_bundle_metadata_for_layout, rationale: sampled DAG depth in nodes, audit_status: keep}
  - {artifact: emitted_metadata_common, path: "graph_edge_density", type: "float", presence: always, stability_tier: stable, producer: dagzoo.core.generation_runtime._base_bundle_metadata_for_layout, rationale: sampled DAG edge density, audit_status: keep}
