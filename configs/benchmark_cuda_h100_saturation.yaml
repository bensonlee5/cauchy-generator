seed: 123

dataset:
  task: classification
  n_train: 4096
  n_test: 1024
  n_features_min: 32
  n_features_max: 192
  n_classes_min: 2
  n_classes_max: 16
  categorical_ratio_min: 0.0
  categorical_ratio_max: 1.0
  max_categorical_cardinality: 32

graph:
  n_nodes_min: 4
  n_nodes_max: 64

runtime:
  device: cuda
  torch_dtype: float32
  fixed_layout_target_cells: 32000000

output:
  out_dir: data/benchmark_cuda_h100_saturation
  shard_size: 512
  compression: zstd

benchmark:
  preset_name: cuda_h100_saturation
  suite: standard
  num_datasets: 1500
  warmup_datasets: 25
  warn_threshold_pct: 10.0
  fail_threshold_pct: 20.0
  collect_memory: true
  collect_reproducibility: false
  reproducibility_num_datasets: 2
  latency_num_samples: 20
  presets:
    custom:
      device: cuda
      num_datasets: 1500
      warmup_datasets: 25

filter:
  enabled: false
  max_attempts: 3
