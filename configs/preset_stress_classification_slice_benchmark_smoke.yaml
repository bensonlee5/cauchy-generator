seed: 82

stress:
  profile: anti_memorization_piecewise_classification_slice_v1

runtime:
  device: cpu

output:
  out_dir: benchmarks/results/smoke_stress_classification_slice
  shard_size: 16
  compression: zstd

diagnostics:
  enabled: false

benchmark:
  preset_name: stress_classification_slice_smoke
  suite: smoke
  num_datasets: 20
  warmup_datasets: 0
  warn_threshold_pct: 10.0
  fail_threshold_pct: 20.0
  collect_memory: false
  collect_reproducibility: false
  reproducibility_num_datasets: 1
  latency_num_samples: 5
  presets:
    stress_classification_slice_smoke:
      device: cpu
      num_datasets: 20
      warmup_datasets: 0
