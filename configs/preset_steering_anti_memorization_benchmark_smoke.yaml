seed: 77

dataset:
  task: regression
  n_train: 128
  n_test: 32
  n_features_min: 8
  n_features_max: 16

graph:
  n_nodes_min: 8
  n_nodes_max: 12

steering:
  enabled: true
  preset: anti_memorization_piecewise_v1

runtime:
  device: cpu

output:
  out_dir: benchmarks/results/smoke_steering
  shard_size: 16
  compression: zstd

diagnostics:
  enabled: false
  include_spearman: false
  histogram_bins: 8
  quantiles: [0.1, 0.5, 0.9]
  underrepresented_threshold: 0.5
  max_values_per_metric: 10000
  meta_feature_targets:
    shift_graph_scale: [0.0, 0.5]
    shift_noise_variance_multiplier: [1.0, 1.5]

benchmark:
  preset_name: steering_smoke
  suite: smoke
  num_datasets: 20
  warmup_datasets: 0
  warn_threshold_pct: 10.0
  fail_threshold_pct: 20.0
  collect_memory: false
  collect_reproducibility: false
  reproducibility_num_datasets: 1
  latency_num_samples: 5
  presets:
    steering_smoke:
      device: cpu
      num_datasets: 20
      warmup_datasets: 0

filter:
  enabled: false
