seed: 123

dataset:
  task: classification
  n_train: 8192
  n_test: 2048
  n_features_min: 64
  n_features_max: 256
  n_classes_min: 2
  n_classes_max: 16
  categorical_ratio_min: 0.0
  categorical_ratio_max: 1.0
  max_categorical_cardinality: 32

graph:
  n_nodes_min: 8
  n_nodes_max: 96

runtime:
  device: cuda
  torch_dtype: float32
  fixed_layout_target_cells: 32000000

output:
  out_dir: data/benchmark_cuda_h100_large_shape
  shard_size: 512
  compression: zstd

benchmark:
  preset_name: cuda_h100_large_shape
  suite: standard
  num_datasets: 1000
  warmup_datasets: 20
  warn_threshold_pct: 10.0
  fail_threshold_pct: 20.0
  collect_memory: true
  collect_reproducibility: false
  reproducibility_num_datasets: 2
  latency_num_samples: 20
  presets:
    custom:
      device: cuda
      num_datasets: 1000
      warmup_datasets: 20

filter:
  enabled: false
  n_estimators: 25
  max_depth: 6
  max_features: auto
  n_bootstrap: 200
  easy_skill_threshold: 0.8
  easy_gain_threshold: 0.1
  hard_skill_threshold: 0.0
  max_attempts: 3
