name: test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version-bump-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate PR version bump
        run: python scripts/ci/check_pr_version_bump.py --pyproject pyproject.toml --base-ref origin/main

  fast-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Bootstrap repo
        run: ./scripts/dev bootstrap
      - name: Install docs build dependencies
        run: npm ci --prefix site
      - name: Dead code
        run: >
          uv run vulture src/dagzoo tests
          --ignore-names __getattr__
      - name: Fast affected verification
        run: ./scripts/dev verify affected --source base --base origin/main --incremental --parallel

  coverage-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Bootstrap repo
        run: ./scripts/dev bootstrap
      - name: Test with coverage
        run: >
          uv run pytest
          --cov=dagzoo
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -q
      - name: Enforce diff coverage
        run: uv run diff-cover coverage.xml --compare-branch origin/main --fail-under=90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py3.14-pr
          path: coverage.xml
          retention-days: 14

  coverage-main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Bootstrap repo
        run: ./scripts/dev bootstrap
      - name: Adoption surface parity
        run: uv run python scripts/ci/check_adoption_surface.py
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src
      - name: Dead code
        run: >
          uv run vulture src/dagzoo tests
          --ignore-names __getattr__
      - name: Test with coverage
        run: >
          uv run pytest
          --cov=dagzoo
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py3.14
          path: coverage.xml
          retention-days: 14
