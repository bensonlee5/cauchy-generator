name: test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group dev
      - name: Dead code
        run: >
          uv run vulture src/dagzoo tests
          --ignore-names __getattr__
      - name: Fast affected verification
        run: ./scripts/dev verify affected --source base --base origin/main --incremental --parallel

  coverage-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group dev
      - name: Test with coverage
        run: >
          uv run pytest
          --cov=dagzoo
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -q
      - name: Enforce diff coverage
        run: uv run diff-cover coverage.xml --compare-branch origin/main --fail-under=90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py3.14-pr
          path: coverage.xml
          retention-days: 14

  coverage-main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src
      - name: Dead code
        run: >
          uv run vulture src/dagzoo tests
          --ignore-names __getattr__
      - name: Test with coverage
        run: >
          uv run pytest
          --cov=dagzoo
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py3.14
          path: coverage.xml
          retention-days: 14
